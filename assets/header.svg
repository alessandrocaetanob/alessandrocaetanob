<svg width="820" height="260" viewBox="0 0 820 260" xmlns="http://www.w3.org/2000/svg">
  <defs>
    <linearGradient id="borda" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#FF6AC1"/>
      <stop offset="50%" stop-color="#B794F4"/>
      <stop offset="100%" stop-color="#7D56F4"/>
    </linearGradient>
    <linearGradient id="corpo" x1="0%" y1="0%" x2="0%" y2="100%">
      <stop offset="0%" stop-color="#FF9CE3"/>
      <stop offset="100%" stop-color="#F25D94"/>
    </linearGradient>
    <mask id="digita1">
      <rect x="40" y="80" width="0" height="26" fill="white">
        <animate attributeName="width" from="0" to="100" dur="0.8s" begin="0.5s" fill="freeze"/>
      </rect>
    </mask>
    <mask id="digita2">
      <rect x="40" y="140" width="0" height="26" fill="white">
        <animate attributeName="width" from="0" to="160" dur="1s" begin="2.4s" fill="freeze"/>
      </rect>
    </mask>
  </defs>

  <!-- janela do terminal -->
  <rect x="6" y="6" width="808" height="248" rx="16" fill="#1B1B2F" stroke="url(#borda)" stroke-width="2.5"/>

  <!-- barra de titulo -->
  <circle cx="34" cy="34" r="7" fill="#FF6AC1"/>
  <circle cx="58" cy="34" r="7" fill="#FFD787"/>
  <circle cx="82" cy="34" r="7" fill="#02BF87"/>
  <text x="410" y="39" text-anchor="middle" font-family="'Courier New', Courier, monospace" font-size="14" fill="#8886A8">alessandro@hyperius: ~</text>
  <line x1="6" y1="52" x2="814" y2="52" stroke="#2E2C4A" stroke-width="1.5"/>

  <!-- comando 1 -->
  <g mask="url(#digita1)">
    <text x="40" y="99" font-family="'Courier New', Courier, monospace" font-size="17" fill="#02BF87">$ <tspan fill="#E8E6F5">whoami</tspan></text>
  </g>
  <g opacity="0">
    <text x="40" y="128" font-family="'Courier New', Courier, monospace" font-size="19" font-weight="bold" fill="#FF6AC1">Alessandro Caetano Beltrão</text>
    <animate attributeName="opacity" from="0" to="1" dur="0.5s" begin="1.6s" fill="freeze"/>
  </g>

  <!-- comando 2 -->
  <g mask="url(#digita2)">
    <text x="40" y="159" font-family="'Courier New', Courier, monospace" font-size="17" fill="#02BF87">$ <tspan fill="#E8E6F5">cat stack.txt</tspan></text>
  </g>
  <g opacity="0">
    <text x="40" y="188" font-family="'Courier New', Courier, monospace" font-size="16" fill="#B794F4">Cloud &amp; Infrastructure Engineer</text>
    <text x="40" y="212" font-family="'Courier New', Courier, monospace" font-size="15" fill="#8886A8">Azure · Kubernetes · DevOps · C# · Python</text>
    <animate attributeName="opacity" from="0" to="1" dur="0.5s" begin="3.6s" fill="freeze"/>
  </g>

  <!-- prompt final com cursor piscando -->
  <g opacity="0">
    <text x="40" y="240" font-family="'Courier New', Courier, monospace" font-size="17" fill="#02BF87">$</text>
    <rect x="58" y="226" width="10" height="18" fill="#FF6AC1">
      <animate attributeName="opacity" values="1;1;0;0" keyTimes="0;0.5;0.5;1" dur="1.1s" begin="4.2s" repeatCount="indefinite"/>
    </rect>
    <animate attributeName="opacity" from="0" to="1" dur="0.3s" begin="4.2s" fill="freeze"/>
  </g>

  <!-- mascote: o "byte", um fantasminha de terminal -->
  <g transform="translate(690 150)">
    <animateTransform attributeName="transform" type="translate" values="690 150; 690 141; 690 150" dur="2.6s" repeatCount="indefinite" calcMode="spline" keySplines="0.45 0 0.55 1; 0.45 0 0.55 1"/>
    <!-- sombra -->
    <ellipse cx="0" cy="52" rx="34" ry="7" fill="#000000" opacity="0.35">
      <animate attributeName="rx" values="34;28;34" dur="2.6s" repeatCount="indefinite"/>
    </ellipse>
    <!-- antena -->
    <line x1="0" y1="-58" x2="0" y2="-74" stroke="#B794F4" stroke-width="3" stroke-linecap="round"/>
    <circle cx="0" cy="-80" r="6" fill="#B794F4">
      <animate attributeName="opacity" values="1;0.4;1" dur="1.6s" repeatCount="indefinite"/>
      <animate attributeName="r" values="6;7.5;6" dur="1.6s" repeatCount="indefinite"/>
    </circle>
    <!-- corpo -->
    <path d="M -42,32 L -42,-12 C -42,-40 -20,-58 0,-58 C 20,-58 42,-40 42,-12 L 42,32 L 28,22 L 14,32 L 0,22 L -14,32 L -28,22 Z" fill="url(#corpo)" stroke="#1B1B2F" stroke-width="3"/>
    <!-- olhos -->
    <g>
      <ellipse cx="-14" cy="-16" rx="4.5" ry="8" fill="#1B1B2F"/>
      <ellipse cx="14" cy="-16" rx="4.5" ry="8" fill="#1B1B2F"/>
      <animate attributeName="opacity" values="1;1;0;1;1" keyTimes="0;0.92;0.95;0.98;1" dur="4.5s" repeatCount="indefinite"/>
    </g>
    <!-- bochechas -->
    <circle cx="-26" cy="-4" r="5.5" fill="#FFB3DE" opacity="0.85"/>
    <circle cx="26" cy="-4" r="5.5" fill="#FFB3DE" opacity="0.85"/>
    <!-- boquinha -->
    <path d="M -5,-2 Q 0,3 5,-2" stroke="#1B1B2F" stroke-width="2.5" fill="none" stroke-linecap="round"/>
  </g>
</svg>
